# Release : déclenchée par un tag vX.Y.Z poussé. `workflow_dispatch` = mode à blanc (tout construire et vérifier, rien publier).
# Le mode à blanc échoue tant que le CHANGELOG n'a pas de section « ## <version de package.json> » (« Non publié » ne suffit pas) : c'est voulu.
# Le tag doit être léger (`git tag vX.Y.Z`) et pointer sur la tête de main ; un tag annoté est refusé à la publication.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par tag ; on n'annule jamais une publication en cours.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier que le tag pointe sur la tête de main
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit $GITHUB_SHA n'est pas dans l'historique de main : release refusée." >&2
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Le tag ne pointe pas sur la tête de main : release refusée." >&2
            exit 1
          fi

      - name: Récupérer les tags existants (mode à blanc)
        if: github.ref_type != 'tag'
        run: git fetch --tags origin

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Vérifier tag, versions et CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            # Mode à blanc : on simule le tag de la version courante.
            TAG="v$(node -p "require('./package.json').version")"
            echo "Mode à blanc : tag simulé $TAG"
          fi
          node scripts/release.mjs --ci "$TAG" release-notes.md

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Empreinte SHA-256 et notes de release
        run: |
          sha256sum package.zip | tee package.zip.sha256
          HASH="$(cut -d ' ' -f 1 package.zip.sha256)"
          printf '\nSHA-256 de package.zip : `%s`\n' "$HASH" >> release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            package.zip
            release-notes.md

  publish:
    # Uniquement sur tag : le mode à blanc s'arrête après `build`.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $TAG" >&2; exit 1; }
          REMOTE_SHA="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Le tag $TAG ne pointe plus sur $GITHUB_SHA (actuel : $REMOTE_SHA) : publication refusée." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          gh release create "$TAG" package.zip \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "DocSeeker $VERSION" \
            --notes-file release-notes.md
